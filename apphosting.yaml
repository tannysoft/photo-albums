# Firebase App Hosting config — runs the Next.js server on Cloud Run.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 2048 # headroom for sharp image processing & zip streaming
  minInstances: 0
  maxInstances: 2
  concurrency: 40

env:
  # ── Public Firebase web config (shipped in the client bundle anyway) ──
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDhCgZk5iNHxiCMVgBke642Fyhuh6b0laI
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: photo-albums-46fae.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: photo-albums-46fae
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: photo-albums-46fae.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "405987276233"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:405987276233:web:13ffc757dd9722df192418
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_R2_PUBLIC_BASE_URL
    value: https://pub-c5be9dc8369e4a4286b344f1e82e8b48.r2.dev
    availability: [BUILD, RUNTIME]

  # ── Non-secret server config ──
  - variable: FIREBASE_PROJECT_ID
    value: photo-albums-46fae
    availability: [RUNTIME]
  - variable: FIREBASE_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@photo-albums-46fae.iam.gserviceaccount.com
    availability: [RUNTIME]
  - variable: R2_ACCOUNT_ID
    value: 8a21a543bd0ac55148179deddb67ee1c
    availability: [RUNTIME]
  - variable: R2_BUCKET
    value: photo-albums
    availability: [RUNTIME]
  - variable: ADMIN_EMAILS
    value: tannysoft@gmail.com
    availability: [RUNTIME]

  # ── Secrets (stored in Cloud Secret Manager, not in this file) ──
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability: [RUNTIME]
  - variable: R2_ACCESS_KEY_ID
    secret: R2_ACCESS_KEY_ID
    availability: [RUNTIME]
  - variable: R2_SECRET_ACCESS_KEY
    secret: R2_SECRET_ACCESS_KEY
    availability: [RUNTIME]
